<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ETF 温度计">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="515080 / 513530 / 563020 / 513100 / 513650 五只红利与 QDII ETF 的盘中价格、PE 估值分位、股息率与买入建议;">
<title>ETF 温度计 · 五只 ETF 估值看板</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./app.css?v=13">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand__logo">估</div>
    <div>
      <h1 class="brand__name">ETF 温度计</h1>
      <div class="brand__sub" id="dataDate">正在读取数据…</div>
    </div>
  </div>
  <button class="icon-btn" id="btnRefresh" type="button" aria-label="刷新行情">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 3v6h-6"></path>
    </svg>
  </button>
</header>

<main class="wrap">

  <section class="view is-active" id="view-home">
    <div class="advice" id="homeAdvice"></div>
    <div class="section-title"><h2>五只 ETF</h2><span id="homeMeta"></span></div>
    <div class="grid" id="cardGrid"></div>
    <p class="note" id="homeNote"></p>
  </section>

  <section class="view" id="view-data">
    <div class="section-title"><h2>估值明细</h2><span id="dataUpdated"></span></div>
    <div class="datalist" id="dataList"></div>
    <p class="note" id="dataStatusText"></p>
  </section>

  <section class="view" id="view-about">
    <div class="section-title"><h2>怎么读这张表</h2></div>
    <div class="prose" id="aboutProse"></div>
  </section>

</main>

<nav class="tabbar" id="tabbar">
  <button class="tab is-active" type="button" data-view="home">总览</button>
  <button class="tab" type="button" data-view="data">数据</button>
  <button class="tab" type="button" data-view="about">说明</button>
</nav>

<div class="sheet" id="sheet">
  <div class="sheet__backdrop" data-close="1"></div>
  <div class="sheet__panel" id="sheetPanel"></div>
</div>

<div class="install" id="installBar" hidden>
  <div class="install__text" id="installText"></div>
  <button class="btn btn--primary btn--sm" id="installGo" type="button">添加</button>
  <button class="icon-btn icon-btn--sm" id="installClose" type="button" aria-label="关闭">×</button>
</div>

<div class="toast" id="toast"></div>

<script src="./data.js?v=13"></script>
<script src="./app.js?v=13"></script>
</body>
</html>
